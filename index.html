<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="計時即時記錄" />
  <meta name="theme-color" content="#0e1015" />
  <title>計時即時記錄</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="icon" type="image/svg+xml" href="icon.svg" />
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js" defer></script>
  <style>
    :root {
      --bg-dark: #0e1015;
      --bg-card: #1b1f29;
      --bg-card-dim: #14171f;
      --accent: #f59e0b;
      --accent-bright: #fbbf24;
      --accent-dark: #b45309;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --danger: #ef4444;
      --gap-slower: #f87171;
      --gap-faster: #4ade80;
      --success: #22c55e;
      --radius: 14px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    input, select {
      user-select: text;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: var(--bg-dark);
      background-image:
        radial-gradient(circle at 80% 18%, rgba(245, 158, 11, 0.12), transparent 45%),
        radial-gradient(circle at 20% 85%, rgba(245, 158, 11, 0.08), transparent 45%);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
      overflow: hidden;
      touch-action: manipulation;
    }

    .app-container {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    .page {
      display: none;
      width: 100%;
      height: 100%;
      flex-direction: column;
      padding-top: var(--safe-top);
      padding-bottom: var(--safe-bottom);
      padding-left: var(--safe-left);
      padding-right: var(--safe-right);
    }

    .page.active {
      display: flex;
    }

    /* ===== 共用元件 ===== */
    .page-title {
      font-size: clamp(26px, 6vw, 36px);
      font-weight: 800;
      color: var(--accent-bright);
      letter-spacing: 1px;
      margin: 0;
      text-align: center;
    }

    .btn-primary {
      width: 100%;
      background: linear-gradient(180deg, var(--accent-bright), var(--accent));
      color: #111827;
      border: none;
      border-radius: 999px;
      padding: 15px 24px;
      font-size: 20px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 6px 20px rgba(245, 158, 11, 0.3);
      transition: transform 0.08s ease, filter 0.1s ease;
    }

    .btn-primary:active {
      transform: scale(0.97);
      filter: brightness(0.95);
    }

    .btn-ghost {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-main);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 10px;
      padding: 8px 14px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-ghost:active {
      background: rgba(255, 255, 255, 0.16);
    }

    .btn-ghost:disabled {
      opacity: 0.35;
      pointer-events: none;
    }

    .scroll-area {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 12px 18px;
    }

    .footer-bar {
      padding: 12px 18px 16px;
      background: linear-gradient(180deg, rgba(14, 16, 21, 0), rgba(14, 16, 21, 0.95) 30%);
    }

    /* ===== 第一頁：設定頁 ===== */
    #page1 .scroll-area,
    #page1 .footer-bar {
      max-width: 600px;
      width: 100%;
      margin: 0 auto;
    }

    .p1-header {
      padding: 18px 18px 8px;
    }

    .field-group {
      margin-bottom: 16px;
    }

    .field-label-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
      gap: 10px;
    }

    .field-label {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-main);
      display: block;
      margin-bottom: 8px;
    }

    .field-label-row .field-label {
      margin-bottom: 0;
    }

    .scan-btn {
      background: linear-gradient(180deg, var(--accent-bright), var(--accent));
      color: #111827;
      border: none;
      border-radius: 10px;
      padding: 7px 12px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 3px 10px rgba(245, 158, 11, 0.25);
    }

    .scan-btn:active {
      transform: scale(0.96);
    }

    .input-white, .select-white {
      width: 100%;
      height: 50px;
      background: #ffffff;
      color: #111827;
      border: none;
      border-radius: 12px;
      padding: 0 14px;
      font-size: 18px;
      font-weight: 700;
      outline: none;
      appearance: none;
      -webkit-appearance: none;
    }

    .select-wrap {
      position: relative;
    }

    .select-wrap::after {
      content: "▼";
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #334155;
      font-size: 12px;
      pointer-events: none;
    }

    .time-12h-row {
      display: grid;
      grid-template-columns: 1.1fr 1fr 1fr;
      gap: 8px;
    }

    .scan-status {
      font-size: 13px;
      color: var(--accent-bright);
      margin-top: 6px;
      min-height: 18px;
    }

    /* ===== 第二頁：出發名單 ===== */
    .top-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px 6px;
    }

    .p2-container {
      max-width: 760px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
    }

    .p2-col-headers {
      display: grid;
      grid-template-columns: 94px 66px 1fr 48px;
      gap: 8px;
      padding: 6px 18px;
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 600;
    }

    .roster-row {
      display: grid;
      grid-template-columns: 94px 66px 1fr 48px;
      gap: 8px;
      align-items: center;
      margin-bottom: 10px;
    }

    .roster-time-btn {
      height: 46px;
      background: rgba(245, 158, 11, 0.14);
      border: 1px solid rgba(245, 158, 11, 0.45);
      border-radius: 10px;
      color: var(--accent-bright);
      font-size: 14px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      cursor: pointer;
      padding: 0 4px;
    }

    .roster-noc-input {
      height: 46px;
      width: 100%;
      background: #ffffff;
      color: #111827;
      border: none;
      border-radius: 10px;
      padding: 0 6px;
      font-size: 14px;
      font-weight: 700;
      text-align: center;
      text-transform: uppercase;
      outline: none;
    }

    .roster-name-input {
      height: 46px;
      width: 100%;
      background: #ffffff;
      color: #111827;
      border: none;
      border-radius: 10px;
      padding: 0 10px;
      font-size: 15px;
      font-weight: 600;
      outline: none;
    }

    .roster-target-btn {
      height: 46px;
      width: 48px;
      border-radius: 10px;
      border: 1.5px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-muted);
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.12s ease;
    }

    .roster-target-btn.selected {
      background: var(--accent);
      border-color: var(--accent-bright);
      color: #111827;
      box-shadow: 0 0 12px rgba(245, 158, 11, 0.45);
    }

    /* ===== 第三頁：即時計時主畫面 ===== */
    .p3-topbar {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding: 10px 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(14, 16, 21, 0.92);
      flex-shrink: 0;
    }

    .p3-topbar-left {
      justify-self: start;
    }

    .p3-clock {
      justify-self: center;
      font-size: clamp(22px, 5vw, 30px);
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      letter-spacing: 1px;
      color: #ffffff;
    }

    .p3-topbar-right {
      justify-self: end;
    }

    .p3-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
    }

    .p3-list-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    /* 預設 5 欄（未指定基準選手） */
    .p3-list-header {
      display: grid;
      grid-template-columns: 34px 1fr 56px 76px 82px;
      gap: 6px;
      padding: 8px 16px 6px;
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 700;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      flex-shrink: 0;
    }

    .p3-list-header span:nth-child(n+3) {
      text-align: right;
    }

    .p3-cards {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 8px 12px 14px;
    }

    .athlete-card {
      display: grid;
      grid-template-columns: 34px 1fr 56px 76px 82px;
      gap: 6px;
      align-items: center;
      background: var(--bg-card);
      border: 1.5px solid rgba(255, 255, 255, 0.07);
      border-radius: 12px;
      padding: 11px 10px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: transform 0.08s ease, border-color 0.15s ease, background 0.15s ease;
    }

    /* 有指定基準選手時：7 欄（名次、選手、圈數、單圈、單圈秒差、累計、總秒差） */
    .p3-list-panel.has-target .p3-list-header {
      grid-template-columns: 24px 1fr 38px 54px 48px 58px 50px;
      gap: 4px;
      padding: 8px 10px 6px;
      font-size: 11px;
    }

    .p3-list-panel.has-target .p3-cards {
      padding: 8px 8px 14px;
    }

    .p3-list-panel.has-target .athlete-card {
      grid-template-columns: 24px 1fr 38px 54px 48px 58px 50px;
      gap: 4px;
      padding: 10px 6px;
    }

    .p3-list-panel.has-target .rank-cell {
      font-size: 16px;
    }

    .p3-list-panel.has-target .athlete-name {
      font-size: 14px;
    }

    .p3-list-panel.has-target .lap-badge {
      font-size: 11px;
      padding: 2px 5px;
    }

    .p3-list-panel.has-target .time-cell {
      font-size: 13px;
    }

    .athlete-card:active {
      transform: scale(0.985);
    }

    .athlete-card.selectable {
      border-color: rgba(245, 158, 11, 0.45);
    }

    .athlete-card.dimmed {
      background: var(--bg-card-dim);
      opacity: 0.72;
    }

    .athlete-card.finished {
      border-color: rgba(34, 197, 94, 0.5);
    }

    .athlete-card.is-target {
      background: rgba(245, 158, 11, 0.14);
      border-color: var(--accent-bright);
    }

    .rank-cell {
      font-size: 20px;
      font-weight: 800;
      text-align: center;
      color: #ffffff;
      font-variant-numeric: tabular-nums;
    }

    .rank-cell.rank-1 {
      color: var(--accent-bright);
    }

    .name-cell {
      min-width: 0;
    }

    .noc-tag {
      font-size: 11px;
      font-weight: 800;
      color: var(--accent-bright);
      letter-spacing: 0.5px;
      line-height: 1.1;
    }

    .athlete-name {
      font-size: 16px;
      font-weight: 700;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .lap-cell {
      text-align: right;
    }

    .lap-badge {
      display: inline-block;
      background: var(--accent);
      color: #111827;
      font-size: 12px;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .lap-badge.zero {
      background: rgba(255, 255, 255, 0.12);
      color: var(--text-muted);
    }

    .lap-badge.done {
      background: var(--success);
      color: #052e16;
    }

    .time-cell {
      text-align: right;
      font-size: 15px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: #e2e8f0;
      white-space: nowrap;
    }

    .time-cell.total {
      color: var(--accent-bright);
      font-weight: 800;
    }

    .time-cell.empty {
      color: var(--text-muted);
    }

    .time-cell.gap-slower {
      color: var(--gap-slower);
    }

    .time-cell.gap-faster {
      color: var(--gap-faster);
    }

    .time-cell.gap-base {
      color: var(--accent-bright);
      font-size: 11px;
      font-weight: 800;
    }

    .col-gap {
      display: none;
    }

    .p3-list-panel.has-target .col-gap {
      display: block;
    }

    /* 控制區（待分配佇列 + 紀錄時間鍵） */
    .p3-control-panel {
      flex-shrink: 0;
      background: #13161e;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding: 10px 14px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .queue-banner {
      background: rgba(180, 83, 9, 0.28);
      border: 1px solid rgba(245, 158, 11, 0.6);
      border-radius: 12px;
      padding: 8px 12px;
      display: none;
      flex-direction: column;
      gap: 6px;
    }

    .queue-banner.has-items {
      display: flex;
    }

    .queue-title {
      font-size: 14px;
      font-weight: 800;
      color: #fef3c7;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .queue-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .queue-chip {
      background: rgba(14, 16, 21, 0.75);
      border: 1px solid rgba(251, 191, 36, 0.5);
      color: var(--accent-bright);
      font-size: 13px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      padding: 4px 8px;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .queue-chip.active-first {
      background: var(--accent);
      color: #111827;
      border-color: var(--accent-bright);
    }

    .queue-chip-del {
      background: none;
      border: none;
      color: inherit;
      font-size: 14px;
      font-weight: 900;
      cursor: pointer;
      padding: 0 2px;
      opacity: 0.75;
    }

    .btn-record {
      width: 100%;
      min-height: 60px;
      background: linear-gradient(180deg, var(--accent-bright), var(--accent));
      color: #111827;
      border: none;
      border-radius: 16px;
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 2px;
      cursor: pointer;
      box-shadow: 0 6px 22px rgba(245, 158, 11, 0.35);
      transition: transform 0.06s ease;
    }

    .btn-record:active {
      transform: scale(0.96);
    }

    /* ===== 橫式版面適配（手機與平板：紀錄時間鍵置於右下角） ===== */
    @media (orientation: landscape) {
      .p1-form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px 18px;
      }

      .p1-form-grid .field-group {
        margin-bottom: 0;
      }

      .p1-form-grid .span-2 {
        grid-column: span 2;
      }

      #page1 .scroll-area,
      #page1 .footer-bar {
        max-width: 820px;
      }

      .p1-header {
        padding: 10px 18px 4px;
      }

      .p3-topbar {
        padding: 6px 16px;
      }

      .p3-body {
        flex-direction: row;
      }

      .p3-list-panel {
        flex: 1;
        border-right: 1px solid rgba(255, 255, 255, 0.08);
      }

      .p3-control-panel {
        width: clamp(200px, 26vw, 290px);
        border-top: none;
        justify-content: flex-end;
        padding: 12px 14px 16px;
        background: rgba(19, 22, 30, 0.96);
      }

      .btn-record {
        min-height: 76px;
        font-size: 23px;
      }
    }

    /* 平板大螢幕字體與欄寬微調 */
    @media (min-width: 768px) {
      .p3-list-header,
      .athlete-card {
        grid-template-columns: 44px 1fr 72px 104px 110px;
        gap: 10px;
        padding-left: 16px;
        padding-right: 16px;
      }

      .p3-list-panel.has-target .p3-list-header,
      .p3-list-panel.has-target .athlete-card {
        grid-template-columns: 36px 1fr 62px 84px 74px 88px 78px;
        gap: 8px;
        padding-left: 14px;
        padding-right: 14px;
        font-size: 13px;
      }

      .p3-list-panel.has-target .athlete-name {
        font-size: 17px;
      }

      .p3-list-panel.has-target .time-cell {
        font-size: 16px;
      }

      .p3-list-panel.has-target .rank-cell {
        font-size: 20px;
      }

      .athlete-name {
        font-size: 19px;
      }

      .time-cell {
        font-size: 18px;
      }

      .rank-cell {
        font-size: 22px;
      }
    }

    /* ===== Modal 與 Toast ===== */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.72);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-card {
      width: 100%;
      max-width: 360px;
      background: #1e2330;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.5);
    }

    .modal-title {
      font-size: 19px;
      font-weight: 800;
      margin: 0 0 12px;
      color: var(--accent-bright);
    }

    .modal-desc {
      font-size: 14px;
      color: var(--text-muted);
      margin: 0 0 16px;
      line-height: 1.5;
    }

    .modal-time-inputs {
      display: grid;
      grid-template-columns: 1fr auto 1fr auto 1fr;
      align-items: center;
      gap: 6px;
      margin-bottom: 18px;
    }

    .modal-time-inputs input {
      width: 100%;
      height: 48px;
      border-radius: 10px;
      border: none;
      text-align: center;
      font-size: 20px;
      font-weight: 800;
      background: #ffffff;
      color: #111827;
    }

    .modal-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .modal-actions-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .btn-modal-confirm {
      background: var(--accent);
      color: #111827;
      border: none;
      border-radius: 12px;
      padding: 12px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
    }

    .btn-modal-danger {
      background: rgba(239, 68, 68, 0.18);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.45);
      border-radius: 12px;
      padding: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-modal-cancel {
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      padding: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .toast {
      position: fixed;
      top: calc(var(--safe-top) + 64px);
      left: 50%;
      transform: translateX(-50%) translateY(-10px);
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid var(--accent);
      color: #ffffff;
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 700;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      z-index: 200;
      white-space: nowrap;
      max-width: 90vw;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- ==================== 第一頁：設定頁 ==================== -->
    <section id="page1" class="page active">
      <div class="p1-header">
        <h1 class="page-title">計時即時記錄</h1>
      </div>

      <div class="scroll-area">

  <!-- 出發時間微調視窗 -->

        <button type="button" id="btnFinishToRoster" class="btn-modal-confirm">返回出發名單修改</button>
        <button type="button" id="btnFinishResetAll" class="btn-modal-danger">結束賽事並回到首頁（清除紀錄）</button>
        <button type="button" id="btnCancelFinish" class="btn-modal-cancel">取消</button>
      </div>

  <div id="toast" class="toast"></div>

  <script>
    const STORAGE_KEY = 'tt_live_timing_state_v1';

    let state = {
      currentPage: 1,
      config: {
        period: 'PM',
        hour12: 1,
        minute: 30,
        laps: 4,
        intervalSec: 60,
        count: 18,
        distanceKm: ''
      },
      athletes: [],
      targetAthleteId: null,
      pendingQueue: [],
      historyStack: [],
      scannedRoster: null
    };

    let editingAthleteId = null;
    let toastTimer = null;

    // ===== 工具函式 =====
    function pad2(n) {
      return String(Math.floor(Math.max(0, n))).padStart(2, '0');
    }

    function to24Hour(period, hour12) {
      let h = Number(hour12);
      if (period === 'AM') return h === 12 ? 0 : h;
      return h === 12 ? 12 : h + 12;
    }

    function from24Hour(h24) {
      const period = h24 >= 12 ? 'PM' : 'AM';
      let hour12 = h24 % 12;
      if (hour12 === 0) hour12 = 12;
      return { period, hour12 };
    }

    function secToHMS(totalSec) {
      const s = ((totalSec % 86400) + 86400) % 86400;
      const hh = Math.floor(s / 3600);
      const mm = Math.floor((s % 3600) / 60);
      const ss = s % 60;
      return `${pad2(hh)}:${pad2(mm)}:${pad2(ss)}`;
    }

    function getTodayTimestampFromSec(startSec) {
      const now = new Date();
      const base = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 0, 0, 0, 0);
      return base.getTime() + startSec * 1000;
    }

    function formatClockMs(ms, withTenths = false) {
      const d = new Date(ms);
      const base = `${pad2(d.getHours())}:${pad2(d.getMinutes())}:${pad2(d.getSeconds())}`;
      if (!withTenths) return base;
      const tenth = Math.floor(d.getMilliseconds() / 100);
      return `${base}.${tenth}`;
    }

    function formatDuration(ms) {
      if (ms == null || ms < 0) return '--:--.-';
      const totalTenths = Math.floor(ms / 100);
      const tenths = totalTenths % 10;
      const totalSec = Math.floor(totalTenths / 10);
      const sec = totalSec % 60;
      const totalMin = Math.floor(totalSec / 60);
      const min = totalMin % 60;
      const hr = Math.floor(totalMin / 60);
      if (hr > 0) {
        return `${hr}:${pad2(min)}:${pad2(sec)}.${tenths}`;
      }
      return `${pad2(min)}:${pad2(sec)}.${tenths}`;
    }

    function formatGap(diffMs) {
      if (diffMs == null) return { text: '--', cls: 'empty' };
      const roundedTenths = Math.round(diffMs / 100);
      if (roundedTenths === 0) return { text: '0.0', cls: '' };

      const sign = roundedTenths > 0 ? '+' : '-';
      const cls = roundedTenths > 0 ? 'gap-slower' : 'gap-faster';
      const absTenths = Math.abs(roundedTenths);
      const tenths = absTenths % 10;
      const totalSec = Math.floor(absTenths / 10);
      const sec = totalSec % 60;
      const totalMin = Math.floor(totalSec / 60);

      if (totalMin > 0) {
        return { text: `${sign}${totalMin}:${pad2(sec)}.${tenths}`, cls };
      }
      return { text: `${sign}${sec}.${tenths}`, cls };
    }

    function showToast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {}
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;
        const parsed = JSON.parse(raw);
        if (parsed && parsed.config) {
          state = Object.assign(state, parsed);
        }
      } catch (e) {}
    }

    // ===== 初始化下拉選單 =====
    function initSelectOptions() {
      const hourSel = document.getElementById('startHour');
      for (let h = 1; h <= 12; h++) {
        const opt = document.createElement('option');
        opt.value = h;
        opt.textContent = `${pad2(h)} 時`;
        hourSel.appendChild(opt);
      }

      const minSel = document.getElementById('startMinute');
      for (let m = 0; m < 60; m++) {
        const opt = document.createElement('option');
        opt.value = m;
        opt.textContent = `${pad2(m)} 分`;
        minSel.appendChild(opt);
      }

      const lapsSel = document.getElementById('lapsSelect');
      for (let l = 1; l <= 15; l++) {
        const opt = document.createElement('option');
        opt.value = l;
        opt.textContent = `${l} 圈`;
        lapsSel.appendChild(opt);
      }

      const countSel = document.getElementById('countSelect');
      for (let c = 1; c <= 40; c++) {
        const opt = document.createElement('option');
        opt.value = c;
        opt.textContent = `${c} 人`;
        countSel.appendChild(opt);
      }
    }

    function syncPage1InputsFromState() {
      document.getElementById('startPeriod').value = state.config.period;
      document.getElementById('startHour').value = state.config.hour12;
      document.getElementById('startMinute').value = state.config.minute;
      document.getElementById('lapsSelect').value = state.config.laps;
      document.getElementById('intervalSelect').value = state.config.intervalSec;
      document.getElementById('countSelect').value = state.config.count;
      document.getElementById('distanceInput').value = state.config.distanceKm;
    }

    function readPage1Config() {
      state.config.period = document.getElementById('startPeriod').value;
      state.config.hour12 = Number(document.getElementById('startHour').value);
      state.config.minute = Number(document.getElementById('startMinute').value);
      state.config.laps = Number(document.getElementById('lapsSelect').value);
      state.config.intervalSec = Number(document.getElementById('intervalSelect').value);
      state.config.count = Number(document.getElementById('countSelect').value);
      state.config.distanceKm = document.getElementById('distanceInput').value.trim();
    }

    // ===== 切換頁面 =====
    function showPage(pageNum) {
      state.currentPage = pageNum;
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.getElementById(`page${pageNum}`).classList.add('active');
      if (pageNum === 2) renderPage2();
      if (pageNum === 3) renderPage3();
      saveState();
    }

    // ===== 掃描出發單 (Tesseract.js OCR) =====
    function parseStartListText(text) {
      const lines = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
      const parsedAthletes = [];
      const timeRegex = /\b([01]?\d|2[0-3]):([0-5]\d)(?::([0-5]\d))?\b/;
      const nocRegex = /\b([A-Z]{3})\b/g;
      const ignoreNoc = new Set(['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT', 'JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC', 'OCA', 'UCI', 'NOC', 'DOB', 'FNL', 'PDF']);

      const configMatch = text.match(/(\d+(?:\.\d+)?)\s*km\s*[x×]\s*(\d+)\s*lap/i);
      let detectedDist = null;
      let detectedLaps = null;
      if (configMatch) {
        detectedDist = configMatch[1];
        detectedLaps = Math.min(15, Math.max(1, parseInt(configMatch[2], 10)));
      }

      for (const line of lines) {
        const tm = line.match(timeRegex);
        if (!tm) continue;
        if (/report|created|start\s*time/i.test(line)) continue;

        const hh = parseInt(tm[1], 10);
        const mm = parseInt(tm[2], 10);
        const ss = tm[3] ? parseInt(tm[3], 10) : 0;
        const startSec = hh * 3600 + mm * 60 + ss;

        let rest = line.slice(tm.index + tm[0].length).trim();
        let noc = '';
        const nocMatches = [...rest.matchAll(nocRegex)].map(m => m[1]).filter(c => !ignoreNoc.has(c));
        if (nocMatches.length > 0) {
          noc = nocMatches[0];
          const nocIdx = rest.indexOf(noc);
          rest = rest.slice(0, nocIdx).trim();
        }
        rest = rest.replace(/^\d+\s*/, '').replace(/\d+\s*$/, '').trim();

        parsedAthletes.push({ startSec, noc, name: rest });
      }

      return { parsedAthletes, detectedDist, detectedLaps };
    }

    async function handleScanFile(file) {
      if (!file) return;
      const statusEl = document.getElementById('scanStatus');
      if (typeof Tesseract === 'undefined') {
        statusEl.textContent = 'OCR 模組尚未載入完成，請確認網路連線後再試。';
        return;
      }

      statusEl.textContent = '正在掃描辨識出發單，請稍候...';
      try {
        const result = await Tesseract.recognize(file, 'eng', {
          logger: m => {
            if (m.status === 'recognizing text') {
              statusEl.textContent = `辨識中... ${Math.round(m.progress * 100)}%`;
            }
          }
        });

        const { parsedAthletes, detectedDist, detectedLaps } = parseStartListText(result.data.text || '');

        if (parsedAthletes.length === 0) {
          statusEl.textContent = '未偵測到出發時間格式，請拍清晰一點或手動輸入。';
          return;
        }

        const firstSec = parsedAthletes[0].startSec;
        const h24 = Math.floor(firstSec / 3600);
        const m = Math.floor((firstSec % 3600) / 60);
        const { period, hour12 } = from24Hour(h24);
        state.config.period = period;
        state.config.hour12 = hour12;
        state.config.minute = m;
        state.config.count = Math.min(40, Math.max(1, parsedAthletes.length));

        if (parsedAthletes.length >= 2) {
          const diff = parsedAthletes[1].startSec - parsedAthletes[0].startSec;
          if ([30, 60, 90, 120].includes(diff)) {
            state.config.intervalSec = diff;
          }
        }
        if (detectedLaps) state.config.laps = detectedLaps;
        if (detectedDist) state.config.distanceKm = detectedDist;

        state.scannedRoster = parsedAthletes.slice(0, 40);
        syncPage1InputsFromState();
        saveState();
        statusEl.textContent = `已辨識 ${state.scannedRoster.length} 位選手資訊，按下「確認」可檢視與修改！`;
        showToast(`成功帶入 ${state.scannedRoster.length} 位選手`);
      } catch (err) {
        statusEl.textContent = '掃描失敗，請重試或直接手動輸入。';
      }
    }

    // ===== 建立／同步第二頁名單 =====
    function prepareAthletesForPage2() {
      readPage1Config();
      const baseStartSec = to24Hour(state.config.period, state.config.hour12) * 3600 + state.config.minute * 60;
      const count = state.config.count;
      const interval = state.config.intervalSec;

      const nextAthletes = [];
      for (let i = 0; i < count; i++) {
        const scanned = state.scannedRoster && state.scannedRoster[i];
        const existing = state.athletes[i];

        if (scanned) {
          nextAthletes.push({
            id: `ath_${i + 1}`,
            order: i + 1,
            startSec: scanned.startSec,
            noc: scanned.noc || '',
            name: scanned.name || '',
            timestamps: existing ? existing.timestamps : []
          });
        } else if (existing) {
          nextAthletes.push({
            ...existing,
            id: `ath_${i + 1}`,
            order: i + 1,
            startSec: existing.manualTime ? existing.startSec : baseStartSec + i * interval
          });
        } else {
          nextAthletes.push({
            id: `ath_${i + 1}`,
            order: i + 1,
            startSec: baseStartSec + i * interval,
            noc: '',
            name: '',
            timestamps: []
          });
        }
      }
      state.athletes = nextAthletes;
      state.scannedRoster = null;

      // 若人數縮減導致原本指定的基準選手不存在，則清除指定
      if (state.targetAthleteId && !state.athletes.some(a => a.id === state.targetAthleteId)) {
        state.targetAthleteId = null;
      }
    }

    function renderPage2() {
      const listEl = document.getElementById('rosterList');
      listEl.innerHTML = '';

      state.athletes.forEach((ath, idx) => {
        const row = document.createElement('div');
        row.className = 'roster-row';

        const timeBtn = document.createElement('button');
        timeBtn.type = 'button';
        timeBtn.className = 'roster-time-btn';
        timeBtn.textContent = secToHMS(ath.startSec);
        timeBtn.addEventListener('click', () => openTimeEditModal(ath.id));

        const nocInput = document.createElement('input');
        nocInput.type = 'text';
        nocInput.className = 'roster-noc-input';
        nocInput.maxLength = 6;
        nocInput.placeholder = '代碼';
        nocInput.value = ath.noc;
        nocInput.addEventListener('input', e => {
          ath.noc = e.target.value.toUpperCase();
          saveState();
        });

        const nameInput = document.createElement('input');
        nameInput.type = 'text';
        nameInput.className = 'roster-name-input';
        nameInput.placeholder = `選手 ${idx + 1}（可留白）`;
        nameInput.value = ath.name;
        nameInput.addEventListener('input', e => {
          ath.name = e.target.value;
          saveState();
        });

        const isSelected = state.targetAthleteId === ath.id;
        const targetBtn = document.createElement('button');
        targetBtn.type = 'button';
        targetBtn.className = `roster-target-btn ${isSelected ? 'selected' : ''}`;
        targetBtn.textContent = isSelected ? '★' : '☆';
        targetBtn.title = isSelected ? '取消指定基準選手' : '指定為秒差基準選手';
        targetBtn.addEventListener('click', () => {
          state.targetAthleteId = isSelected ? null : ath.id;
          saveState();
          renderPage2();
        });

        row.appendChild(timeBtn);
        row.appendChild(nocInput);
        row.appendChild(nameInput);
        row.appendChild(targetBtn);
        listEl.appendChild(row);
      });
    }

    // ===== 出發時間微調視窗 =====
    function openTimeEditModal(athleteId) {
      const ath = state.athletes.find(a => a.id === athleteId);
      if (!ath) return;
      editingAthleteId = athleteId;
      const s = ((ath.startSec % 86400) + 86400) % 86400;
      document.getElementById('editHour').value = pad2(Math.floor(s / 3600));
      document.getElementById('editMin').value = pad2(Math.floor((s % 3600) / 60));
      document.getElementById('editSec').value = pad2(s % 60);
      document.getElementById('timeEditTargetLabel').textContent =
        `調整「${ath.name || `選手 ${ath.order}`}」的出發時間`;
      document.getElementById('timeEditModal').classList.add('open');
    }

    function closeTimeEditModal() {
      editingAthleteId = null;
      document.getElementById('timeEditModal').classList.remove('open');
    }

    // ===== 第三頁：即時計時與排序 =====
    function getAthleteStats(ath) {
      const lapsDone = ath.timestamps.length;
      if (lapsDone === 0) {
        return { lapsDone: 0, lastLapMs: null, totalMs: null };
      }
      const startTs = getTodayTimestampFromSec(ath.startSec);
      const lastTs = ath.timestamps[lapsDone - 1];
      const prevTs = lapsDone === 1 ? startTs : ath.timestamps[lapsDone - 2];
      return {
        lapsDone,
        lastLapMs: lastTs - prevTs,
        totalMs: lastTs - startTs
      };
    }

    function getSortedAthletes() {
      return state.athletes
        .map(ath => ({ ath, stats: getAthleteStats(ath) }))
        .sort((a, b) => {
          if (b.stats.lapsDone !== a.stats.lapsDone) {
            return b.stats.lapsDone - a.stats.lapsDone;
          }
          if (a.stats.lapsDone > 0) {
            return a.stats.totalMs - b.stats.totalMs;
          }
          return a.ath.order - b.ath.order;
        });
    }

    function renderQueue() {
      const banner = document.getElementById('queueBanner');
      const countEl = document.getElementById('queueCount');
      const chipsEl = document.getElementById('queueChips');

      if (state.pendingQueue.length === 0) {
        banner.classList.remove('has-items');
        chipsEl.innerHTML = '';
        return;
      }

      banner.classList.add('has-items');
      countEl.textContent = `${state.pendingQueue.length} 筆`;
      chipsEl.innerHTML = '';

      state.pendingQueue.forEach((ts, idx) => {
        const chip = document.createElement('span');
        chip.className = `queue-chip ${idx === 0 ? 'active-first' : ''}`;
        chip.innerHTML = `<span>${formatClockMs(ts, true)}</span>`;

        const delBtn = document.createElement('button');
        delBtn.type = 'button';
        delBtn.className = 'queue-chip-del';
        delBtn.textContent = '×';
        delBtn.title = '移除此筆時間';
        delBtn.addEventListener('click', e => {
          e.stopPropagation();
          const removed = state.pendingQueue.splice(idx, 1)[0];
          state.historyStack.push({ type: 'REMOVE_QUEUE', index: idx, timestamp: removed });
          renderPage3();
          saveState();
        });

        chip.appendChild(delBtn);
        chipsEl.appendChild(chip);
      });
    }

    function renderPage3() {
      const listPanel = document.getElementById('p3ListPanel');
      const cardsEl = document.getElementById('timingCards');
      const sorted = getSortedAthletes();
      const targetLaps = state.config.laps;
      const hasPending = state.pendingQueue.length > 0;

      const targetObj = state.targetAthleteId
        ? sorted.find(item => item.ath.id === state.targetAthleteId)
        : null;
      const hasTarget = Boolean(targetObj);

      listPanel.classList.toggle('has-target', hasTarget);
      document.getElementById('btnUndo').disabled = state.historyStack.length === 0;
      renderQueue();

      cardsEl.innerHTML = '';
      let currentRank = 0;

      sorted.forEach(({ ath, stats }) => {
        const isZero = stats.lapsDone === 0;
        const isFinished = stats.lapsDone >= targetLaps;
        const isTarget = hasTarget && ath.id === targetObj.ath.id;
        if (!isZero) currentRank++;

        const card = document.createElement('div');
        card.className = [
          'athlete-card',
          isZero ? 'dimmed' : '',
          isFinished ? 'finished' : '',
          isTarget ? 'is-target' : '',
          hasPending && !isFinished ? 'selectable' : ''
        ].join(' ').trim();

        const displayName = ath.name.trim() || `選手 ${ath.order}`;
        const rankText = isZero ? '-' : currentRank;
        const rankClass = !isZero && currentRank === 1 ? 'rank-cell rank-1' : 'rank-cell';

        const lapBadgeClass = isFinished
          ? 'lap-badge done'
          : isZero
            ? 'lap-badge zero'
            : 'lap-badge';
        const lapText = isFinished ? `${stats.lapsDone}完` : `${stats.lapsDone}圈`;

        // 計算單圈秒差與總秒差
        let lapGapHtml = '';
        let totalGapHtml = '';
        if (hasTarget) {
          if (isTarget) {
            lapGapHtml = `<div class="time-cell col-gap gap-base">基準</div>`;
            totalGapHtml = `<div class="time-cell col-gap gap-base">基準</div>`;
          } else {
            // 單圈秒差：雙方皆有完成圈數即比較最新單圈
            const lapDiff =
              stats.lastLapMs != null && targetObj.stats.lastLapMs != null
                ? stats.lastLapMs - targetObj.stats.lastLapMs
                : null;
            const lapGap = formatGap(lapDiff);
            lapGapHtml = `<div class="time-cell col-gap ${lapGap.cls}">${lapGap.text}</div>`;

            // 總秒差：僅在完成圈數相同（且 > 0）時才比較
            const totalDiff =
              stats.lapsDone > 0 && stats.lapsDone === targetObj.stats.lapsDone
                ? stats.totalMs - targetObj.stats.totalMs
                : null;
            const totalGap = formatGap(totalDiff);
            totalGapHtml = `<div class="time-cell col-gap ${totalGap.cls}">${totalGap.text}</div>`;
          }
        }

        card.innerHTML = `
          <div class="${rankClass}">${rankText}</div>
          <div class="name-cell">
            ${ath.noc ? `<div class="noc-tag">${ath.noc}</div>` : ''}
            <div class="athlete-name">${isTarget ? '★ ' : ''}${displayName}</div>
          </div>
          <div class="lap-cell">
            <span class="${lapBadgeClass}">${lapText}</span>
          </div>
          <div class="time-cell ${isZero ? 'empty' : ''}">${formatDuration(stats.lastLapMs)}</div>
          ${lapGapHtml}
          <div class="time-cell total ${isZero ? 'empty' : ''}">${formatDuration(stats.totalMs)}</div>
          ${totalGapHtml}
        `;

        card.addEventListener('click', () => assignPendingTimeToAthlete(ath.id));
        cardsEl.appendChild(card);
      });
    }

    function recordTimestamp() {
      const nowMs = Date.now();
      state.pendingQueue.push(nowMs);
      state.historyStack.push({ type: 'RECORD', timestamp: nowMs });
      renderPage3();
      saveState();
    }

    function assignPendingTimeToAthlete(athleteId) {
      if (state.pendingQueue.length === 0) {
        showToast('請先按下「紀錄時間」');
        return;
      }

      const ath = state.athletes.find(a => a.id === athleteId);
      if (!ath) return;

      if (ath.timestamps.length >= state.config.laps) {
        showToast(`${ath.name || `選手 ${ath.order}`} 已完成全部 ${state.config.laps} 圈`);
        return;
      }

      const candidateTs = state.pendingQueue[0];
      const startTs = getTodayTimestampFromSec(ath.startSec);
      const prevTs = ath.timestamps.length === 0 ? startTs : ath.timestamps[ath.timestamps.length - 1];

      if (candidateTs < prevTs) {
        showToast(`時間早於出發或上一圈時間（出發 ${secToHMS(ath.startSec)}）`);
        return;
      }

      const assignedTs = state.pendingQueue.shift();
      ath.timestamps.push(assignedTs);
      state.historyStack.push({
        type: 'ASSIGN',
        athleteId: ath.id,
        timestamp: assignedTs
      });

      renderPage3();
      saveState();
    }

    function undoLastAction() {
      if (state.historyStack.length === 0) return;
      const last = state.historyStack.pop();

      if (last.type === 'RECORD') {
        const idx = state.pendingQueue.lastIndexOf(last.timestamp);
        if (idx !== -1) state.pendingQueue.splice(idx, 1);
        showToast('已復原：取消剛紀錄的時間');
      } else if (last.type === 'ASSIGN') {
        const ath = state.athletes.find(a => a.id === last.athleteId);
        if (ath && ath.timestamps.length > 0) {
          ath.timestamps.pop();
        }
        state.pendingQueue.unshift(last.timestamp);
        showToast('已復原：退回上一筆分配');
      } else if (last.type === 'REMOVE_QUEUE') {
        state.pendingQueue.splice(last.index, 0, last.timestamp);
        showToast('已復原：恢復待分配時間');
      }

      renderPage3();
      saveState();
    }

    function startLiveClock() {
      const clockEl = document.getElementById('liveClock');
      function tick() {
        clockEl.textContent = formatClockMs(Date.now(), false);
      }
      tick();
      setInterval(tick, 200);
    }

    function bindEvents() {
      document.getElementById('btnScanStartList').addEventListener('click', () => {
        document.getElementById('scanFileInput').click();
      });

      document.getElementById('scanFileInput').addEventListener('change', e => {
        const file = e.target.files && e.target.files[0];
        handleScanFile(file);
        e.target.value = '';
      });

      document.getElementById('btnToPage2').addEventListener('click', () => {
        prepareAthletesForPage2();
        showPage(2);
      });

      document.getElementById('btnBackToPage1').addEventListener('click', () => {
        showPage(1);
      });

      document.getElementById('btnToPage3').addEventListener('click', () => {
        showPage(3);
      });

      document.getElementById('btnCancelTimeEdit').addEventListener('click', closeTimeEditModal);
      document.getElementById('btnSaveTimeEdit').addEventListener('click', () => {
        const ath = state.athletes.find(a => a.id === editingAthleteId);
        if (ath) {
          const h = Math.min(23, Math.max(0, parseInt(document.getElementById('editHour').value, 10) || 0));
          const m = Math.min(59, Math.max(0, parseInt(document.getElementById('editMin').value, 10) || 0));
          const s = Math.min(59, Math.max(0, parseInt(document.getElementById('editSec').value, 10) || 0));
          ath.startSec = h * 3600 + m * 60 + s;
          ath.manualTime = true;
          saveState();
          renderPage2();
        }
        closeTimeEditModal();
      });

      document.getElementById('btnRecordTime').addEventListener('click', recordTimestamp);
      document.getElementById('btnUndo').addEventListener('click', undoLastAction);

      document.getElementById('btnFinishRace').addEventListener('click', () => {
        document.getElementById('finishModal').classList.add('open');
      });

      document.getElementById('btnCancelFinish').addEventListener('click', () => {
        document.getElementById('finishModal').classList.remove('open');
      });

      document.getElementById('btnFinishToRoster').addEventListener('click', () => {
        document.getElementById('finishModal').classList.remove('open');
        showPage(2);
      });

      document.getElementById('btnFinishResetAll').addEventListener('click', () => {
        document.getElementById('finishModal').classList.remove('open');
        state.athletes = [];
        state.targetAthleteId = null;
        state.pendingQueue = [];
        state.historyStack = [];
        state.scannedRoster = null;
        saveState();
        showPage(1);
        showToast('已結束並重設賽事');
      });
    }

    initSelectOptions();
    loadState();
    syncPage1InputsFromState();
    bindEvents();
    startLiveClock();
    showPage(state.currentPage || 1);

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
